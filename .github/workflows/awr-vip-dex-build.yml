name: AWR VIP isolated dex build

on:
  push:
    branches:
      - awr-vip-dex-build-20260823
    paths:
      - 'awr-vip-build/**'
      - '.github/workflows/awr-vip-dex-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'awr-vip-build/**'
      - '.github/workflows/awr-vip-dex-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile isolated Kotlin Activity
        working-directory: awr-vip-build
        run: gradle --no-daemon clean classes

      - name: Build classes2.dex
        shell: bash
        run: |
          mkdir -p awr-vip-build/out awr-vip-build/jarstage
          cp -a awr-vip-build/build/classes/kotlin/main/. awr-vip-build/jarstage/
          (cd awr-vip-build/jarstage && jar cf ../awrvip.jar .)
          KOTLIN_STDLIB="$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib" -type f -name 'kotlin-stdlib-*.jar' | head -n1)"
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          "$D8" --min-api 23 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --lib "$KOTLIN_STDLIB" --output awr-vip-build/out awr-vip-build/awrvip.jar
          mv awr-vip-build/out/classes.dex awr-vip-build/out/classes2.dex
          sha256sum awr-vip-build/out/classes2.dex
          unzip -l awr-vip-build/awrvip.jar

      - uses: actions/upload-artifact@v4
        with:
          name: awr-vip-classes2
          path: awr-vip-build/out/classes2.dex
          if-no-files-found: error
          retention-days: 1
